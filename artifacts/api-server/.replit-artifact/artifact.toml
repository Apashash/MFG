kind = "api"
previewPath = "/"
title = "Market Flow Group"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "Market Flow Group"
paths = ["/"]

[services.development]
run = "node /home/runner/workspace/server.js"

[services.production.run]
args = ["node", "/home/runner/workspace/server.js"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
